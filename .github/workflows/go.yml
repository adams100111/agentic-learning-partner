name: Go

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true

      - name: Verify formatting
        run: |
          files="$(gofmt -l cmd internal schemas)"
          test -z "$files" || {
            echo "$files"
            exit 1
          }

      - name: Test
        run: go test ./...

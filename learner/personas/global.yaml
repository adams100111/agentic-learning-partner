schemaVersion: 1
scope: global
domain: null

teaching:
  pace: senior-dense
  preferredActivityTypes:
    - real-project
    - code-reading
    - debugging
    - implementation
    - architecture-review
    - code-review
    - active-recall
  avoid:
    - toy-examples
    - beginner-programming-explanations
    - repetitive-concept-definition
    - fixed-course-sequencing-without-evidence
    - praise-without-substance
  emphasis:
    - production-quality
    - explicit-tradeoffs
    - architectural-reasoning
    - current-practices
    - evidence-based-progress
  feedback:
    - direct
    - technically-specific
    - challenge-questionable-abstractions
    - distinguish-syntax-from-engineering-reasoning

analogyPolicy:
  defaultPriority:
    - laravel
    - nestjs
    - dotnet
    - fastapi
  semanticOverrides:
    cancellation:
      prefer:
        - dotnet
      reason: CancellationToken is often the closest familiar semantic scaffold for cancellation propagation.
    structural-typing:
      prefer:
        - typescript
      reason: TypeScript structural typing is a closer scaffold than nominal C# interfaces.
    framework-magic:
      prefer:
        - laravel
        - nestjs
      reason: These stacks make useful contrasts when Go intentionally prefers explicit construction and local reasoning.

risks:
  - over-abstracting Go using Laravel/NestJS/.NET architectural habits
  - disengaging when material becomes generic beginner instruction
  - allowing AI agents to hide important implementation details during learning

provenance:
  - sourceType: learner-stated
    observedAt: "2026-10-05T00:00:00+03:00"
    confidence: high
